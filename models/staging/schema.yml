version: 2

models:
  - name: customers_dummy_view
    columns:
      - name: customer_id
        description: Id of a customer
      - name: first_order
        description: First order of a customer
      - name: most_recent_order
        description: Last order of a customer
      - name: number_of_orders
        description: Total number of order
        
  - name: stg_customers
    columns:
      - name: customer_id
        data_tests:
          - unique
          - not_null

  - name: stg_orders
    columns:
      - name: order_id
        data_tests:
          - unique
          - not_null
      - name: status
        data_tests:
          - accepted_values:
              values: ['placed', 'shipped', 'completed', 'return_pending', 'returned']

  - name: stg_payments
    columns:
      - name: payment_id
        data_tests:
          - unique
          - not_null
      - name: payment_method
        data_tests:
          - accepted_values:
              values: ['credit_card', 'coupon', 'bank_transfer', 'gift_card']
